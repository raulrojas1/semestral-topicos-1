name: 03 - Despliegue en ECS

on:
  # Automático al terminar con éxito el pipeline 2 en main
  workflow_run:
    workflows: ["02 - Construcción y publicación en ECR"]
    types: [completed]
    branches: [main]
  # Manual: desplegar (o revertir a) cualquier tag existente en ECR
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de imagen en ECR (SHA corto)"
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolver tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)"
          fi
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Tag inválido"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Desplegar en ECS
        run: bash pipelines/scripts/deploy.sh "${{ steps.tag.outputs.tag }}"

      - name: Verificar que la aplicación está operativa
        run: bash pipelines/scripts/smoke-test.sh "${{ steps.tag.outputs.tag }}"
