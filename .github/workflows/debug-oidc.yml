name: debug-oidc (temporal)

on:
  push:
    paths: [".github/workflows/debug-oidc.yml"]

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    env:
      APP_ROLE: ${{ vars.AWS_APP_ROLE_ARN }}
      TF_ROLE: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
      REGION: ${{ vars.AWS_REGION }}
      BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - name: Mostrar claims del token OIDC y variables
        run: |
          T="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          P="$(echo "$T" | cut -d. -f2 | tr '_-' '/+')"
          while [ $((${#P} % 4)) -ne 0 ]; do P="$P="; done
          CLAIMS="$(echo "$P" | base64 -d | jq -c '{sub,aud,iss,repository,repository_owner,ref,job_workflow_ref}')"
          echo "::error title=OIDC claims::$CLAIMS"
          echo "::error title=Variables::APP=[$APP_ROLE] TF=[$TF_ROLE] REGION=[$REGION] BUCKET=[$BUCKET]"
