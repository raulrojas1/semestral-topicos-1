# Prueba local: docker compose up --build  ->  http://localhost:8080
# En AWS el ALB enruta /api/* al backend; en local lo hace nginx con nginx.local.conf.
services:
  backend:
    build: ./backend
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
